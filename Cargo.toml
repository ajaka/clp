[package]
name = "clp"
version = "0.1.0"
edition = "2024"
description = "A clipboard tool for Linux with multiple copy modes"
license = "MIT"
repository = "https://github.com/ajaka/clp"
keywords = ["clipboard", "cli", "linux", "copy", "paste"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
colored = "2.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31.15"
x11rb = "0.13.2"

[dev-dependencies]
tempfile = "3.20.0"
